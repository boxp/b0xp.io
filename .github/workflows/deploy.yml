name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      # 現フェーズ（BOXP-275 stage 公開）では main push を stage プロジェクトへのみデプロイする。
      # 本番 boxp-portfolio へのデプロイは本番切替フェーズで追加する。
      STAGE_PROJECT_NAME: boxp-portfolio-stage
      STAGE_SITE_URL: https://portfolio-stage.b0xp.io
      # secrets は step の if で直接参照できないため job env 経由で有無を判定する。
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PR では本番設定でビルドし、Lighthouse で本番相当のメタ（noindex なし）を検証する。
      - name: Build (production settings)
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Build (stage settings)
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          SITE_ENV: stage
          SITE_URL: ${{ env.STAGE_SITE_URL }}

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

      # main への push 時のみ stage へデプロイする。PR ではビルドと Lighthouse のみ。
      - name: Deploy to Cloudflare Pages (stage)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name "$STAGE_PROJECT_NAME" --branch main

      - name: Deploy skipped (CLOUDFLARE_API_TOKEN not set)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN が未設定のため stage デプロイをスキップしました。boxp/arch の deploy-portfolio-stage.yml（workflow_dispatch）でデプロイするか、このリポジトリの Secrets に CLOUDFLARE_API_TOKEN（Pages: Edit）を設定してください。"

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI (mobile)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
